name: planner
description: Calendario, todo, eventi, agenda e note con sync su Google Drive.
publish_to: 'none'
version: 1.3.0+55

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  #
  # `table_calendar` **non c'e' piu'**: la griglia del mese e' nostra
  # (`month_grid.dart`), disegnata da un painter. La dipendenza era rimasta
  # solo per la vista mese, e un pacchetto che nessuno importa e' peso morto.

  # Localizzazione: giorni e mesi in italiano (locale it_IT in AppShell).
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Database (SQLite raw, niente code-gen)
  sqlite3: ^2.4.5
  sqlite3_flutter_libs: ^0.5.24

  # Stato
  provider: ^6.1.2

  # Percorsi e ID
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.5.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  share_plus: ^13.3.0
  home_widget: ^0.10.0

  # Import una tantum dal calendario del telefono (Android/iOS).
  # La pagina di import è in `lib/features/calendar_import/`.
  device_calendar_plus: ^0.12.0
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  file_selector: ^1.1.0
  image: ^4.13.1
  image_picker: ^1.2.4
  pdfx: ^2.11.0
  archive: ^4.7.1
  camera: ^0.12.2

  # Le dipendenze di sync (google_sign_in, http) rientrano con l'incremento
  # sync: erano in pubspec senza una sola riga di utilizzo, quindi peso e
  # superficie di build pagati per un futuro che non era ancora arrivato.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  default-flavor: production
  uses-material-design: true

  # Inter (SIL OFL 1.1, licenza in assets/fonts/OFL.txt): un carattere solo per
  # tutta l'app, così la gerarchia non cambia col font di sistema del telefono.
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
